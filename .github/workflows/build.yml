name: build

on:
  push:
    branches:
      - master

permissions:
  contents: read
  statuses: write

jobs:
  esphome_compile:
    name: run esphome compile
    runs-on: ubuntu-latest
    steps:
      - name: checkout master branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: cache platformio toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('requirements.txt') }}

      - name: cache esphome build dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.1.0
        with:
          path: .esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('requirements.txt', 'ac.example.yaml', 'components/**') }}
          restore-keys: ${{ runner.os }}-esphome-

      - name: create venv
        run: python -m venv .venv && ./.venv/bin/pip install -q -r requirements.txt

      - name: create dummy secrets.yaml file
        run: cp ./ac.example.secrets.yaml ./secrets.yaml

      - name: compile component
        id: compile_component_step
        run: bash ./build.sh

      - name: set commit status
        if: ${{ always() && contains(fromJSON('["success", "failure"]'), steps.compile_component_step.conclusion) }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_STATE: ${{ steps.compile_component_step.conclusion }}
        run: |
           ESPHOME_VERSION="$(sed -n 's/^esphome==//p' requirements.txt)"

           gh api "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -H "Accept: application/vnd.github+json" \
            --method POST \
            -f state="${COMPILE_STATE}" \
            -f context="build/esphomeversion" \
            -f description="ESPHome v${ESPHOME_VERSION}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
